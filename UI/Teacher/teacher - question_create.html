<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .fill-icon {
      font-variation-settings: 'FILL' 1;
    }
    /* Hide scrollbar for cleaner look */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "background": "#f8f9ff",
            "tertiary-container": "#996100",
            "primary-container": "#2563eb",
            "tertiary": "#784b00",
            "surface-container-low": "#eff4ff",
            "surface-container-lowest": "#ffffff",
            "error-container": "#ffdad6",
            "surface-variant": "#d3e4fe",
            "surface-container-highest": "#d3e4fe",
            "secondary-fixed": "#6ffbbe",
            "primary-fixed-dim": "#b4c5ff",
            "tertiary-fixed-dim": "#ffb95f",
            "secondary-container": "#6cf8bb",
            "primary": "#004ac6",
            "on-surface-variant": "#434655",
            "on-secondary-fixed-variant": "#005236",
            "on-primary-fixed": "#00174b",
            "inverse-on-surface": "#eaf1ff",
            "error": "#ba1a1a",
            "tertiary-fixed": "#ffddb8",
            "secondary-fixed-dim": "#4edea3",
            "on-background": "#0b1c30",
            "on-secondary-container": "#00714d",
            "on-primary-container": "#eeefff",
            "inverse-surface": "#213145",
            "on-secondary": "#ffffff",
            "surface": "#f8f9ff",
            "on-secondary-fixed": "#002113",
            "on-primary": "#ffffff",
            "on-error": "#ffffff",
            "surface-container": "#e5eeff",
            "on-tertiary-fixed": "#2a1700",
            "primary-fixed": "#dbe1ff",
            "outline-variant": "#c3c6d7",
            "secondary": "#006c49",
            "on-error-container": "#93000a",
            "surface-dim": "#cbdbf5",
            "outline": "#737686",
            "on-tertiary": "#ffffff",
            "on-primary-fixed-variant": "#003ea8",
            "on-tertiary-fixed-variant": "#653e00",
            "surface-bright": "#f8f9ff",
            "on-tertiary-container": "#ffeedd",
            "surface-tint": "#0053db",
            "inverse-primary": "#b4c5ff",
            "on-surface": "#0b1c30",
            "surface-container-high": "#dce9ff"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin-mobile": "1.25rem",
            "stack-sm": "0.5rem",
            "gutter": "1rem",
            "margin-desktop": "2.5rem",
            "stack-md": "1rem",
            "stack-lg": "2rem"
          },
          "fontFamily": {
            "headline-lg": ["Inter"],
            "headline-lg-mobile": ["Inter"],
            "label-sm": ["Inter"],
            "headline-md": ["Inter"],
            "body-lg": ["Inter"],
            "label-md": ["Inter"],
            "body-md": ["Inter"]
          },
          "fontSize": {
            "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
            "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
            "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
            "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
            "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
            "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md text-body-md min-h-screen pb-24 selection:bg-primary/20">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface border-b border-outline-variant shadow-sm flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center gap-3">
<button aria-label="Cancel" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">New Question</h1>
</div>
<button class="bg-primary text-on-primary px-6 py-2 rounded-xl font-label-md text-label-md shadow-sm hover:opacity-90 active:scale-95 transition-all">
      Save
    </button>
</header>
<main class="max-w-3xl mx-auto px-margin-mobile py-stack-lg space-y-stack-lg">
<!-- Question Text Section -->
<section class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-sm transition-all duration-300">
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm">Question</label>
<div class="flex flex-col gap-stack-sm border border-outline-variant rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all">
<!-- Toolbar -->
<div class="flex items-center gap-1 p-2 bg-surface-container border-b border-outline-variant">
<button class="p-2 hover:bg-surface-variant rounded-lg text-on-surface-variant transition-colors"><span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700">format_bold</span></button>
<button class="p-2 hover:bg-surface-variant rounded-lg text-on-surface-variant transition-colors"><span class="material-symbols-outlined" style="font-variation-settings: 'wght' 400">format_italic</span></button>
<button class="p-2 hover:bg-surface-variant rounded-lg text-on-surface-variant transition-colors"><span class="material-symbols-outlined">functions</span></button>
<div class="w-[1px] h-6 bg-outline-variant mx-1"></div>
<button class="p-2 hover:bg-surface-variant rounded-lg text-on-surface-variant transition-colors"><span class="material-symbols-outlined">image</span></button>
</div>
<textarea class="w-full min-h-[140px] p-4 bg-transparent border-none focus:ring-0 text-on-surface resize-none font-body-md text-body-md" placeholder="Type your question here..."></textarea>
</div>
</section>
<!-- Answer Options Builder -->
<section class="space-y-stack-md">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant">Answer Options</label>
<span class="text-label-sm font-label-sm text-outline">Select one correct answer</span>
</div>
<div class="space-y-stack-sm" id="options-container">
<!-- Row 1 (Correct) -->
<div class="flex items-center gap-3 p-3 bg-secondary-container/10 border-2 border-secondary rounded-xl transition-all shadow-sm">
<button class="flex-shrink-0 w-6 h-6 rounded-full border-2 border-secondary bg-secondary flex items-center justify-center transition-all" onclick="markCorrect(this)">
<span class="material-symbols-outlined text-[16px] text-white font-bold">check</span>
</button>
<input class="flex-grow bg-transparent border-none focus:ring-0 font-body-md text-on-surface p-0" type="text" value="Mitochondria"/>
<button class="p-2 text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Row 2 -->
<div class="flex items-center gap-3 p-3 bg-surface-container-lowest border border-outline-variant rounded-xl hover:border-primary/30 transition-all">
<button class="flex-shrink-0 w-6 h-6 rounded-full border-2 border-outline-variant hover:border-primary transition-all" onclick="markCorrect(this)"></button>
<input class="flex-grow bg-transparent border-none focus:ring-0 font-body-md text-on-surface p-0" placeholder="Enter option content..." type="text" value="Nucleus"/>
<button class="p-2 text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Row 3 -->
<div class="flex items-center gap-3 p-3 bg-surface-container-lowest border border-outline-variant rounded-xl hover:border-primary/30 transition-all">
<button class="flex-shrink-0 w-6 h-6 rounded-full border-2 border-outline-variant hover:border-primary transition-all" onclick="markCorrect(this)"></button>
<input class="flex-grow bg-transparent border-none focus:ring-0 font-body-md text-on-surface p-0" placeholder="Enter option content..." type="text" value="Ribosome"/>
<button class="p-2 text-on-surface-variant hover:text-error transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<button class="w-full flex items-center justify-center gap-2 py-4 border-2 border-dashed border-outline-variant rounded-xl text-primary font-label-md hover:bg-primary-container/5 hover:border-primary/40 transition-all group">
<span class="material-symbols-outlined">add</span>
        Add Option
      </button>
</section>
<!-- Score & Bloom's (Bento Layout) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-lg">
<!-- Score Input -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-sm">
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm">Score per correct answer</label>
<div class="flex items-center gap-3 bg-surface-container-low p-3 rounded-xl border border-outline-variant focus-within:border-primary transition-all">
<span class="material-symbols-outlined text-outline">grade</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-headline-md text-headline-md text-on-surface" min="0" type="number" value="1"/>
</div>
</div>
<!-- Tag Selector -->
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-sm">
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm">Tags</label>
<div class="flex flex-wrap gap-2 mb-3">
<span class="inline-flex items-center gap-1 px-3 py-1 bg-surface-container-high rounded-full font-label-sm text-on-surface-variant">
            #Biology
            <button class="hover:text-error"><span class="material-symbols-outlined text-sm">close</span></button>
</span>
<span class="inline-flex items-center gap-1 px-3 py-1 bg-surface-container-high rounded-full font-label-sm text-on-surface-variant">
            #Cells
            <button class="hover:text-error"><span class="material-symbols-outlined text-sm">close</span></button>
</span>
</div>
<div class="flex items-center gap-2 border-b border-outline-variant pb-1 focus-within:border-primary transition-all">
<span class="material-symbols-outlined text-outline text-sm">add</span>
<input class="bg-transparent border-none focus:ring-0 font-label-sm text-label-sm w-full" placeholder="Add tag..." type="text"/>
</div>
</div>
</div>
<!-- Bloom's Taxonomy Selector -->
<section class="space-y-stack-sm">
<label class="block font-label-md text-label-md text-on-surface-variant">Difficulty Level (Bloom's Taxonomy)</label>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
<button class="bloom-btn p-3 rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-1 transition-all bg-surface-container-lowest" onclick="selectBloom(0)">
<span class="font-headline-md text-on-surface">0</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Remember</span>
</button>
<button class="bloom-btn p-3 rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-1 transition-all bg-surface-container-lowest" onclick="selectBloom(1)">
<span class="font-headline-md text-on-surface">1</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Understand</span>
</button>
<button class="bloom-btn p-3 rounded-xl border-2 border-primary bg-primary-container/20 flex flex-col items-center justify-center gap-1 transition-all" onclick="selectBloom(2)">
<span class="font-headline-md text-primary">2</span>
<span class="font-label-sm text-label-sm text-on-primary-container">Apply</span>
</button>
<button class="bloom-btn p-3 rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-1 transition-all bg-surface-container-lowest" onclick="selectBloom(3)">
<span class="font-headline-md text-on-surface">3</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Analyze</span>
</button>
<button class="bloom-btn p-3 rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-1 transition-all bg-surface-container-lowest" onclick="selectBloom(4)">
<span class="font-headline-md text-on-surface">4</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Evaluate</span>
</button>
<button class="bloom-btn p-3 rounded-xl border border-outline-variant flex flex-col items-center justify-center gap-1 transition-all bg-surface-container-lowest" onclick="selectBloom(5)">
<span class="font-headline-md text-on-surface">5</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Create</span>
</button>
</div>
</section>
<!-- Explanation Section -->
<section class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-sm">
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm">Explanation (shown after answer)</label>
<div class="flex items-start gap-3 bg-surface-container-low p-3 rounded-xl border border-outline-variant focus-within:border-primary transition-all">
<span class="material-symbols-outlined text-outline mt-1">lightbulb</span>
<textarea class="w-full min-h-[100px] bg-transparent border-none focus:ring-0 text-on-surface resize-none font-body-md text-body-md" placeholder="Provide pedagogical feedback for the correct answer..."></textarea>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center py-2 px-margin-mobile pb-safe bg-surface-container-lowest shadow-[0_-2px_10px_rgba(15,23,42,0.05)] rounded-t-xl">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all">
<span class="material-symbols-outlined">school</span>
<span class="font-label-sm text-label-sm">Classes</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 scale-95 transition-transform duration-150">
<span class="material-symbols-outlined fill-icon">assignment</span>
<span class="font-label-sm text-label-sm">Grading</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:text-primary transition-all">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</div>
</nav>
<script>
    function markCorrect(btn) {
      const container = document.getElementById('options-container');
      const rows = container.children;
      
      for (let row of rows) {
        // Reset styles
        row.classList.remove('bg-secondary-container/10', 'border-secondary', 'border-2');
        row.classList.add('bg-surface-container-lowest', 'border-outline-variant', 'border');
        
        const radio = row.querySelector('button:first-child');
        radio.classList.remove('border-secondary', 'bg-secondary');
        radio.classList.add('border-outline-variant');
        radio.innerHTML = '';
      }

      // Set Active
      const activeRow = btn.closest('div');
      activeRow.classList.add('bg-secondary-container/10', 'border-secondary', 'border-2');
      activeRow.classList.remove('bg-surface-container-lowest', 'border-outline-variant', 'border');
      
      btn.classList.add('border-secondary', 'bg-secondary');
      btn.innerHTML = '<span class="material-symbols-outlined text-[16px] text-white font-bold">check</span>';
    }

    function selectBloom(index) {
      const btns = document.querySelectorAll('.bloom-btn');
      btns.forEach((btn, i) => {
        if(i === index) {
          btn.classList.add('border-2', 'border-primary', 'bg-primary-container/20');
          btn.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
          btn.querySelector('span:first-child').classList.add('text-primary');
          btn.querySelector('span:last-child').classList.add('text-on-primary-container');
        } else {
          btn.classList.remove('border-2', 'border-primary', 'bg-primary-container/20');
          btn.classList.add('border-outline-variant', 'bg-surface-container-lowest');
          btn.querySelector('span:first-child').classList.remove('text-primary');
          btn.querySelector('span:last-child').classList.remove('text-on-primary-container');
        }
      });
    }
  </script>
</body></html>
