<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-surface border-b border-outline-variant shadow-none">
<div class="flex items-center gap-4">

<div class="flex flex-col">
<h1 class="text-headline-md font-headline-md font-bold text-primary">Alex Johnson</h1>

</div>
</div>
<button class="bg-primary text-on-primary px-4 py-2 rounded-lg font-label-md text-label-md hover:bg-opacity-90 scale-95 active:bg-surface-container-high transition-all">

<main class="flex-1 mt-16 pb-24 overflow-y-auto bg-surface-container-low">
<div class="max-w-screen-xl mx-auto px-margin-mobile py-stack-md flex flex-col gap-stack-lg lg:grid lg:grid-cols-12">

<div class="flex items-center gap-2 overflow-hidden">

</div>
<div class="flex items-center gap-1">
<button class="p-2 hover:bg-surface-container-highest rounded-full transition-colors">

</button>
<button class="p-2 hover:bg-surface-container-highest rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">fullscreen</span>
</button>
</div>
</div>

</div>
</div>
</div>
</section>

<span class="text-label-sm font-label-sm opacity-80">Current Grade</span>
<span class="text-headline-md font-headline-md">85/100 (85%)</span>
</div>
<div class="bg-on-primary-container/20 px-3 py-1 rounded-full border border-on-primary-container/10">

</div>

<!-- Criterion 1 -->
<details class="group bg-surface border border-outline-variant rounded-xl overflow-hidden shadow-sm transition-all-custom" open="">
<summary class="flex items-center justify-between p-4 cursor-pointer hover:bg-surface-container-low transition-colors list-none">

</div>

<span class="text-label-sm font-body-md text-on-surface-variant mt-1">Shows major conceptual misunderstandings or factual errors.</span>
</button>
<button class="flex flex-col items-start p-3 border-2 border-primary bg-primary-container/10 rounded-lg text-left transition-all active:scale-[0.98]">

<span class="text-label-md font-label-md text-primary">Proficient (30 pts)</span>

</button>
<button class="flex flex-col items-start p-3 border border-outline-variant rounded-lg text-left hover:bg-surface-container-low transition-all active:scale-[0.98]">
<span class="text-label-md font-label-md text-on-surface">Exemplary (40 pts)</span>
<span class="text-label-sm font-body-md text-on-surface-variant mt-1">Demonstrates deep mastery and precise scientific terminology.</span>
</button>
</div>
</div>

<button class="p-3 border border-outline-variant rounded-lg text-left hover:bg-surface-container-low transition-all">

</div>
</div>
</details>

<details class="group bg-surface border border-outline-variant rounded-xl overflow-hidden shadow-sm transition-all-custom">

</button>
<button class="p-3 border border-outline-variant rounded-lg text-left hover:bg-surface-container-low transition-all">

</button>
<button class="p-3 border border-outline-variant rounded-lg text-left hover:bg-surface-container-low transition-all">
<span class="text-label-md font-label-md">Exemplary (30 pts)</span>
</button>
</div>
</div>

<span class="material-symbols-outlined">save</span>

</button>
<!-- Primary Action: Submit Grade -->
<button class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-xl px-6 py-2 hover:opacity-90 scale-98 active:brightness-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-md font-label-md">Submit Grade</span>
</button>

<script>
        // Micro-interaction for rubric selection simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.97)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = '';
            });
        });

        // Simple real-time feedback indicator
        const textarea = document.getElementById('feedback');
        textarea.addEventListener('input', () => {
            // Simulated auto-save behavior
            console.log('Draft saved automatically...');
        });
    </script>
