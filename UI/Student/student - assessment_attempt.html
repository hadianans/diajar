<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            color: #0b1c30;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .quiz-option-selected {
            border: 2px solid #004ac6;
            background-color: #eff4ff;
        }
        .distraction-free-header {
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col">
<!-- Assessment Attempt Header (Derived from TopAppBar logic but focus-oriented) -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface h-20 px-margin-mobile md:px-margin-desktop flex items-center justify-between border-b border-outline-variant distraction-free-header">
<div class="flex flex-col">
<h1 class="text-headline-md-mobile md:text-headline-md font-headline-md text-primary">Biology Midterm Quiz</h1>
<span class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">Question 3 of 10</span>
</div>
<div class="flex items-center gap-stack-md bg-error-container text-on-error-container px-4 py-2 rounded-lg">
<span class="material-symbols-outlined text-[20px]">timer</span>
<span class="font-mono font-bold text-body-md" id="countdown">38:42</span>
</div>
</header>
<main class="flex-grow pt-28 pb-32 px-margin-mobile md:px-margin-desktop max-w-4xl mx-auto w-full">
<!-- Progress Bar (Subtle Growth Indicator) -->
<div class="w-full bg-surface-container h-1.5 rounded-full mb-stack-lg overflow-hidden">
<div class="bg-secondary h-full transition-all duration-500 ease-out" style="width: 30%"></div>
</div>
<!-- Question Area -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-stack-lg md:p-10 shadow-sm transition-all">
<div class="flex justify-between items-start mb-stack-md">
<h2 class="text-headline-md font-headline-md text-on-surface">Which organelle is known as the 'powerhouse' of the cell?</h2>
<button class="flex items-center gap-1 text-label-md font-label-md text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[18px]">flag</span>
                    Mark for Review
                </button>
</div>
<!-- Answer Options -->
<div class="mt-stack-lg space-y-4">
<button class="w-full text-left p-5 rounded-lg border border-outline-variant bg-surface hover:bg-surface-container-low transition-all active:scale-[0.98] flex items-center gap-4 group">
<span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full border border-outline text-label-md font-bold group-hover:border-primary group-hover:text-primary">A</span>
<span class="text-body-md font-body-md text-on-surface">Nucleus</span>
</button>
<!-- Selected State (B) -->
<button class="w-full text-left p-5 rounded-lg quiz-option-selected border-2 border-primary bg-surface-container-low transition-all active:scale-[0.98] flex items-center gap-4 group shadow-sm">
<span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full bg-primary text-white text-label-md font-bold">B</span>
<span class="text-body-md font-body-md text-on-surface font-semibold">Mitochondria</span>
<span class="ml-auto material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="w-full text-left p-5 rounded-lg border border-outline-variant bg-surface hover:bg-surface-container-low transition-all active:scale-[0.98] flex items-center gap-4 group">
<span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full border border-outline text-label-md font-bold group-hover:border-primary group-hover:text-primary">C</span>
<span class="text-body-md font-body-md text-on-surface">Ribosomes</span>
</button>
<button class="w-full text-left p-5 rounded-lg border border-outline-variant bg-surface hover:bg-surface-container-low transition-all active:scale-[0.98] flex items-center gap-4 group">
<span class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full border border-outline text-label-md font-bold group-hover:border-primary group-hover:text-primary">D</span>
<span class="text-body-md font-body-md text-on-surface">Golgi Apparatus</span>
</button>
</div>
</div>
<!-- Question Navigation -->
<div class="mt-stack-lg flex flex-col gap-stack-lg">
<div class="flex items-center justify-between">
<button class="flex items-center gap-2 px-6 py-3 text-label-md font-label-md text-primary bg-surface border border-primary rounded-lg hover:bg-surface-container-low active:scale-95 transition-all">
<span class="material-symbols-outlined">arrow_back</span>
                    Previous
                </button>
<button class="flex items-center gap-2 px-8 py-3 text-label-md font-label-md text-white bg-primary-container rounded-lg shadow-md hover:brightness-110 active:scale-95 transition-all">
                    Next
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Scrollable Question Grid -->
<div class="border-t border-outline-variant pt-stack-lg">
<h3 class="text-label-sm font-label-sm text-on-surface-variant uppercase mb-4 tracking-widest">Question Navigation</h3>
<div class="flex items-center gap-3 overflow-x-auto pb-4 hide-scrollbar">
<!-- Nav items -->
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg bg-secondary text-white text-label-md font-bold shadow-sm">1</button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg bg-secondary text-white text-label-md font-bold shadow-sm">2</button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg ring-2 ring-primary ring-offset-2 bg-surface text-primary text-label-md font-bold">3</button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg border border-outline-variant bg-surface text-on-surface-variant text-label-md">4</button>
<!-- Marked for Review -->
<button class="relative flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg border-2 border-tertiary bg-tertiary-fixed text-on-tertiary-fixed text-label-md font-bold">
                        5
                        <span class="absolute -top-1 -right-1 material-symbols-outlined text-[14px] text-tertiary" style="font-variation-settings: 'FILL' 1;">flag</span>
</button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg border border-outline-variant bg-surface text-on-surface-variant text-label-md">6</button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg border border-outline-variant bg-surface text-on-surface-variant text-label-md">7</button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg border border-outline-variant bg-surface text-on-surface-variant text-label-md">8</button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg border border-outline-variant bg-surface text-on-surface-variant text-label-md">9</button>
<button class="flex-shrink-0 w-10 h-10 flex items-center justify-center rounded-lg border border-outline-variant bg-surface text-on-surface-variant text-label-md">10</button>
</div>
</div>
</div>
</main>
<!-- Submission Area (Persistent Footer) -->
<footer class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant py-4 px-margin-mobile md:px-margin-desktop z-50 flex justify-center items-center">
<button class="max-w-md w-full py-4 bg-on-surface text-white rounded-xl font-bold text-body-md hover:bg-primary transition-colors active:scale-95 shadow-lg flex items-center justify-center gap-3" id="submitQuiz">
<span class="material-symbols-outlined">assignment_turned_in</span>
            Finish &amp; Submit Attempt
        </button>
</footer>
<!-- Simple Interactivity -->
<script>
        // Countdown timer simulation
        let time = 38 * 60 + 42;
        const countdownEl = document.getElementById('countdown');
        
        setInterval(() => {
            const minutes = Math.floor(time / 60);
            let seconds = time % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            countdownEl.innerHTML = `${minutes}:${seconds}`;
            if (time > 0) time--;
        }, 1000);

        // Submission prompt logic
        document.getElementById('submitQuiz').addEventListener('click', () => {
            const confirmed = confirm("Are you sure you want to finish the attempt? You still have 7 unanswered questions.");
            if (confirmed) {
                alert("Quiz submitted successfully. Redirecting to dashboard...");
            }
        });

        // Option selection micro-interaction
        const options = document.querySelectorAll('button.w-full.text-left');
        options.forEach(opt => {
            opt.addEventListener('click', () => {
                options.forEach(o => {
                    o.classList.remove('quiz-option-selected', 'border-2', 'border-primary', 'bg-surface-container-low', 'shadow-sm');
                    o.classList.add('border', 'border-outline-variant', 'bg-surface');
                    const text = o.querySelector('.text-on-surface');
                    if(text) text.classList.remove('font-semibold');
                    const icon = o.querySelector('.material-symbols-outlined:last-child');
                    if(icon && icon.textContent === 'check_circle') icon.remove();
                    const badge = o.querySelector('span:first-child');
                    if(badge) {
                        badge.classList.remove('bg-primary', 'text-white');
                        badge.classList.add('border', 'border-outline');
                    }
                });

                opt.classList.remove('border', 'border-outline-variant', 'bg-surface');
                opt.classList.add('quiz-option-selected', 'border-2', 'border-primary', 'bg-surface-container-low', 'shadow-sm');
                const text = opt.querySelector('.text-on-surface');
                if(text) text.classList.add('font-semibold');
                
                const badge = opt.querySelector('span:first-child');
                if(badge) {
                    badge.classList.remove('border', 'border-outline');
                    badge.classList.add('bg-primary', 'text-white');
                }

                const checkIcon = document.createElement('span');
                checkIcon.className = 'ml-auto material-symbols-outlined text-primary';
                checkIcon.style.fontVariationSettings = "'FILL' 1";
                checkIcon.textContent = 'check_circle';
                opt.appendChild(checkIcon);
            });
        });
    </script>
</body></html>
