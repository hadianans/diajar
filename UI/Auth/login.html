<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login | Diajar LMS</title>
    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Config -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed": "#131b2e",
              "on-error": "#ffffff",
              "surface-container": "#e5eeff",
              "secondary-fixed": "#dae2fd",
              "on-surface": "#0b1c30",
              outline: "#737686",
              "surface-bright": "#f8f9ff",
              "on-primary": "#ffffff",
              secondary: "#565e74",
              background: "#f8f9ff",
              "surface-variant": "#d3e4fe",
              "secondary-container": "#dae2fd",
              "on-tertiary-fixed": "#191c1e",
              "tertiary-container": "#6b6e70",
              "on-secondary": "#ffffff",
              "surface-container-high": "#dce9ff",
              "inverse-on-surface": "#eaf1ff",
              "inverse-surface": "#213145",
              "primary-container": "#2563eb",
              surface: "#f8f9ff",
              "on-surface-variant": "#434655",
              "tertiary-fixed-dim": "#c4c7c9",
              "outline-variant": "#c3c6d7",
              "on-tertiary-fixed-variant": "#444749",
              "surface-dim": "#cbdbf5",
              tertiary: "#525657",
              "on-tertiary-container": "#eff1f3",
              primary: "#004ac6",
              "inverse-primary": "#b4c5ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#eff4ff",
              "on-primary-fixed-variant": "#003ea8",
              "on-error-container": "#93000a",
              "on-primary-container": "#eeefff",
              "error-container": "#ffdad6",
              "on-secondary-container": "#5c647a",
              error: "#ba1a1a",
              "on-secondary-fixed-variant": "#3f465c",
              "on-background": "#0b1c30",
              "surface-container-highest": "#d3e4fe",
              "primary-fixed": "#dbe1ff",
              "secondary-fixed-dim": "#bec6e0",
              "on-tertiary": "#ffffff",
              "surface-tint": "#0053db",
              "tertiary-fixed": "#e0e3e5",
              "primary-fixed-dim": "#b4c5ff",
              "on-primary-fixed": "#00174b",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "margin-mobile": "16px",
              base: "4px",
              sm: "16px",
              "container-max": "1280px",
              xs: "8px",
              xl: "48px",
              gutter: "24px",
              md: "24px",
              lg: "32px",
            },
            fontFamily: {
              "headline-md": ["Inter"],
              "display-lg": ["Inter"],
              "headline-lg-mobile": ["Inter"],
              "body-md": ["Inter"],
              "label-md": ["Inter"],
              "label-sm": ["Inter"],
              "headline-lg": ["Inter"],
              "body-lg": ["Inter"],
            },
            fontSize: {
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "headline-lg-mobile": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "label-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.01em",
                  fontWeight: "500",
                },
              ],
              "label-sm": ["12px", { lineHeight: "16px", fontWeight: "600" }],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      .login-card {
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.05);
      }
      /* Fade-in animation for page entry */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface min-h-screen flex flex-col justify-center items-center px-margin-mobile"
  >
    <!-- Global Background Elements (Subtle) -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
      <div
        class="absolute -top-[10%] -right-[5%] w-[400px] h-[400px] bg-primary/5 rounded-full blur-3xl"
      ></div>
      <div
        class="absolute bottom-[10%] -left-[5%] w-[300px] h-[300px] bg-secondary/5 rounded-full blur-3xl"
      ></div>
    </div>
    <!-- Main Login Container -->
    <main
      class="w-full max-w-[400px] flex flex-col items-center animate-fade-in py-lg px-md"
    >
      <!-- Brand Section -->
      <header class="mb-md text-center">
        <div class="flex items-center justify-center mb-sm">
          <!-- Logo Placeholder -->
          <div
            class="w-12 h-12 bg-primary-container rounded-xl flex items-center justify-center text-on-primary-container shadow-md"
          >
            <span
              class="material-symbols-outlined text-[32px]"
              data-icon="school"
              >school</span
            >
          </div>
        </div>
        <h1
          class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-xs"
        >
          Login
        </h1>
      </header>
      <!-- Login Form Card -->
      <section
        class="w-full bg-surface-container-lowest border border-outline-variant p-md rounded-xl login-card"
      >
        <form class="space-y-md" id="loginForm">
          <!-- Email/Username Field -->
          <div class="space-y-xs">
            <label
              class="font-label-md text-label-md text-on-surface"
              for="identity"
              >Email or Username</label
            >
            <div class="relative">
              <input
                class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none"
                id="identity"
                name="identity"
                placeholder="e.g. alex.student@diajar.com"
                required=""
                type="text"
              />
            </div>
          </div>
          <!-- Password Field -->
          <div class="space-y-xs">
            <div class="flex justify-between items-center">
              <label
                class="font-label-md text-label-md text-on-surface"
                for="password"
                >Password</label
              >
              <a
                class="font-label-sm text-label-sm text-primary hover:underline transition-all"
                href="#"
                >Forgot Password?</a
              >
            </div>
            <div class="relative group">
              <input
                class="w-full h-12 pl-md pr-xl bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none"
                id="password"
                name="password"
                placeholder="Enter your password"
                required=""
                type="password"
              />
              <button
                aria-label="Toggle password visibility"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center"
                onclick="togglePassword()"
                type="button"
              >
                <span
                  class="material-symbols-outlined text-[20px]"
                  data-icon="visibility"
                  id="passwordIcon"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <!-- Primary CTA -->
          <button
            class="w-full h-12 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-lg shadow-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
            type="submit"
          >
            Sign In
            <span
              class="material-symbols-outlined text-[18px]"
              data-icon="login"
              >login</span
            >
          </button>
        </form>
      </section>
      <!-- Footer Help -->
      <footer class="mt-lg text-center space-y-md">
        <p class="font-label-md text-label-md text-on-surface-variant">
          Don't have an account?
          <a class="text-primary font-bold hover:underline" href="#"
            >Contact your administrator</a
          >
        </p>
        <div
          class="flex items-center justify-center space-x-md text-label-sm text-outline"
        >
          <a class="hover:text-on-surface transition-colors" href="#"
            >Privacy Policy</a
          >
          <span class="w-1 h-1 bg-outline rounded-full"></span>
          <a class="hover:text-on-surface transition-colors" href="#"
            >Terms of Service</a
          >
        </div>
      </footer>
    </main>
    <!-- Success Feedback Overlay (Initially Hidden) -->
    <div
      class="fixed inset-0 z-50 bg-background/80 backdrop-blur-sm flex items-center justify-center p-margin-mobile opacity-0 pointer-events-none transition-opacity duration-300"
      id="successOverlay"
    >
      <div
        class="bg-surface-container-lowest border border-outline-variant p-lg rounded-xl max-w-[320px] w-full text-center shadow-xl"
      >
        <div
          class="w-16 h-16 bg-primary-container/20 text-primary-container rounded-full mx-auto mb-md flex items-center justify-center"
        >
          <span
            class="material-symbols-outlined text-[40px]"
            data-icon="check_circle"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >check_circle</span
          >
        </div>
        <h2 class="font-headline-md text-headline-md mb-xs text-on-surface">
          Login Successful
        </h2>
        <p class="font-body-md text-body-md text-on-surface-variant mb-md">
          Welcome back! Redirecting to your dashboard...
        </p>
        <div
          class="w-full bg-surface-container-low h-1 rounded-full overflow-hidden"
        >
          <div
            class="bg-primary h-full w-0 transition-all duration-[2000ms]"
            id="progressBar"
          ></div>
        </div>
      </div>
    </div>
    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const passwordIcon = document.getElementById("passwordIcon");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          passwordIcon.innerText = "visibility_off";
        } else {
          passwordInput.type = "password";
          passwordIcon.innerText = "visibility";
        }
      }

      const loginForm = document.getElementById("loginForm");
      const successOverlay = document.getElementById("successOverlay");
      const progressBar = document.getElementById("progressBar");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        // Visual feedback
        successOverlay.classList.remove("opacity-0", "pointer-events-none");

        // Start progress bar animation
        setTimeout(() => {
          progressBar.style.width = "100%";
        }, 100);

        // Simulation of redirection
        setTimeout(() => {
          // In a real app, this would be a location.href change
          console.log("Redirecting to dashboard...");
          alert("Authentication successful. Moving to LMS Dashboard.");
        }, 2500);
      });
    </script>
  </body>
</html>
